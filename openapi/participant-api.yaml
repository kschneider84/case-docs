              - profileId
      responses:
        '200':
          "$ref": "#/components/responses/MessageOk"
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '500':
          "$ref": "#/components/responses/Error500"
  "/v1/user/password":
    post:
      tags:
      - user
      summary: Change password
      security:
      - BearerAuth: []
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                oldPassword:
                  type: string
                newPassword:
                  type: string
              required:
              - oldPassword
              - newPassword
      responses:
        '200':
          "$ref": "#/components/responses/MessageOk"
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '500':
          "$ref": "#/components/responses/Error500"
  "/v1/user/change-account-email":
    post:
      tags:
      - user
      summary: Change account email
      security:
      - BearerAuth: []
      operationId: changeAccountEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
              required:
              - email
              - password
      responses:
        '200':
          "$ref": "#/components/responses/MessageOk"
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '500':
          "$ref": "#/components/responses/Error500"
  "/v1/user/change-phone-number":
    post:
      tags:
      - user
      summary: Change phone number
      security:
      - BearerAuth: []
      operationId: changePhoneNumber
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                newPhoneNumber:
                  type: string
                password:
                  type: string
              required:
              - newPhoneNumber
              - password
      responses:
        '200':
          "$ref": "#/components/responses/MessageOk"
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '429':
          "$ref": "#/components/responses/Error429"
        '500':
          "$ref": "#/components/responses/Error500"
  "/v1/user/request-phone-number-verification":
    get:
      tags:
      - user
      summary: Request phone number verification code via SMS
      security:
      - BearerAuth: []
      operationId: requestPhoneNumberVerification
      responses:
        '200':
          "$ref": "#/components/responses/MessageOk"
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '429':
          "$ref": "#/components/responses/Error429"
        '500':
          "$ref": "#/components/responses/Error500"
  "/v1/user/attributes":
    get:
      tags:
      - user
      summary: Get user attributes
      security:
      - BearerAuth: []
      operationId: getUserAttributes
      responses:
        '200':
          description: Attributes returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  attributes:
                    type: array
                    items:
                      "$ref": "#/components/schemas/UserAttributes"
                required:
                - attributes
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '500':
          "$ref": "#/components/responses/Error500"
    post:
      tags:
      - user
      summary: Create or update a user attribute
      security:
      - BearerAuth: []
      operationId: setUserAttribute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                attributes:
                  type: object
                  additionalProperties: true
              required:
              - type
      responses:
        '200':
          "$ref": "#/components/responses/MessageOk"
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '500':
          "$ref": "#/components/responses/Error500"
  "/v1/user/attributes/{attributeID}":
    delete:
      tags:
      - user
      summary: Delete a user attribute
      security:
      - BearerAuth: []
      operationId: deleteUserAttribute
      parameters:
      - name: attributeID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          "$ref": "#/components/responses/MessageOk"
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '500':
          "$ref": "#/components/responses/Error500"
  "/v1/user/contact-preferences":
    put:
      tags:
      - user
      summary: Update contact preferences
      description: Update the user's newsletter and weekly subscription preferences.
      security:
      - BearerAuth: []
      operationId: updateContactPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subscribedToNewsletter:
                  type: boolean
                  default: false
                  description: Sets the newsletter subscription; omission sets it to false.
                toggleWeeklySubscription:
                  type: boolean
                  default: false
                  description: Toggles the current weekly subscription when true; otherwise leaves it unchanged.
      responses:
        '200':
          "$ref": "#/components/responses/MessageOk"
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '500':
          "$ref": "#/components/responses/Error500"
  "/v1/unsubscribe-newsletter":
    post:
      tags:
      - misc
      summary: Unsubscribe user from newsletter (via token)
      operationId: unsubscribeNewsletter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
              required:
              - token
      responses:
        '200':
          "$ref": "#/components/responses/MessageOk"
        '400':
          "$ref": "#/components/responses/Error400"
        '500':
          "$ref": "#/components/responses/Error500"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    MessageOk:
      description: Generic OK message
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Message"
    Error400:
      description: Bad request
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Error401:
      description: Unauthorized
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Error403:
      description: Forbidden
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Error404:
      description: Not Found
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Error429:
      description: Too many requests
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    Error500:
      description: Internal Server Error
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
      - status
      additionalProperties: false
    Message:
      type: object
      properties:
        message:
          type: string
      required:
      - message
      additionalProperties: false
    Error:
      type: object
      properties:
        error:
          type: string
      required:
      - error
      additionalProperties: false
    TokenEnvelope:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: number
        selectedProfile:
          type: string
      required:
      - accessToken
      - refreshToken
      - expiresIn
      - selectedProfile
      additionalProperties: false
    TokenEnvelopeWithLastOTP:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: number
        selectedProfile:
          type: string
        lastOTP:
          description: OTP verification timestamps by type; null when the renewed token has no OTP history.
          type: [object, "null"]
          additionalProperties:
            type: integer
      required:
      - accessToken
      - refreshToken
      - expiresIn
      - selectedProfile
      - lastOTP
      additionalProperties: false
    AssignedSurvey:
      type: "object"
      properties:
        studyKey:
          type: "string"
        surveyKey:
          type: "string"
        validFrom:
          type: "integer"
        validUntil:
          type: "integer"
        category:
          type: "string"
        profileID:
          type: "string"
    AssignedSurveysWithInfos:
      type: "object"
      properties:
        surveys:
          type: ["array","null"]
          items:
            "$ref": "#/components/schemas/AssignedSurvey"
        surveyInfos:
          type: ["array","null"]
          items:
            anyOf:
            - {"$ref":"#/components/schemas/SurveyInfo"}
            - {"type":"null"}
    AssignedSurveyWithContext:
      type: "object"
      properties:
        survey:
          anyOf:
          - {"$ref":"#/components/schemas/Survey"}
          - {"type":"null"}
        context:
          anyOf:
          - {"$ref":"#/components/schemas/SurveyContext"}
          - {"type":"null"}
        prefill:
          anyOf:
          - {"$ref":"#/components/schemas/SurveyResponse"}
          - {"type":"null"}
    FileInfo:
      type: object
      properties:
        id:
          type: string
          description: ObjectID
        participantID:
          type: string
        status:
          type: string
        uploadedBy:
          type: string
        path:
          type: string
        previewPath:
          type: string
        submittedAt:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        fileType:
          type: string
        visibleToParticipant:
          type: boolean
        size:
          type: integer
      required:
      - id
      - participantID
      - path
      additionalProperties: false
      description: File Info object
    PaginationInfos:
      type: object
      description: Pagination information
      properties:
        totalCount:
          type: integer
        currentPage:
          type: integer
        totalPages:
          type: integer
        pageSize:
          type: integer
      additionalProperties: false
    SubmissionHistory:
      type: "object"
      properties:
        submissions:
          type: ["array","null"]
          items:
            "$ref": "#/components/schemas/SubmissionEntry"
        surveyInfos:
          type: ["array","null"]
          items:
            anyOf:
            - {"$ref":"#/components/schemas/SurveyInfo"}
            - {"type":"null"}
    Report:
      type: object
      description: Report object
      properties:
        id:
          type: string
          description: MongoDB ObjectID as hex string
        key:
          type: string
        participantID:
          type: string
        responseID:
          type: string
        timestamp:
          type: integer
          description: Unix timestamp
        modifiedAt:
          type: string
          format: date-time
        data:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              value:
                type: string
              dtype:
                type: string
                enum:
                - date
                - float
                - int
                - string
                - rawMessage
                - keyList
            additionalProperties: false
      required:
      - key
      - participantID
      - timestamp
      additionalProperties: false
    Participant:
      type: "object"
      properties:
        id:
          type: "string"
        participantId:
          type: "string"
        currentStudySession:
          type: "string"
        modifiedAt:
          type: "integer"
        enteredAt:
          type: "integer"
        studyStatus:
          type: "string"
        flags:
          type: ["object","null"]
          additionalProperties:
            type: "string"
        linkingCodes:
          type: ["object","null"]
          additionalProperties:
            type: "string"
          description: "Linking codes by key. The participant-state endpoint clears this field and returns null."
        assignedSurveys:
          type: ["array","null"]
          items:
            "$ref": "#/components/schemas/AssignedSurvey"
        lastSubmissions:
          type: ["object","null"]
          additionalProperties:
            type: "integer"
        messages:
          type: ["array","null"]
          items:
            "$ref": "#/components/schemas/ParticipantMessage"
        hashedAccountID:
          anyOf:
          - {"type":"string"}
          - {"type":"null"}
        isMainProfile:
          anyOf:
          - {"type":"boolean"}
          - {"type":"null"}
    User:
      type: "object"
      properties:
        id:
          type: "string"
        account:
          "$ref": "#/components/schemas/Account"
        timestamps:
          "$ref": "#/components/schemas/Timestamps"
        profiles:
          type: ["array","null"]
          items:
            "$ref": "#/components/schemas/Profile"
        contactPreferences:
          "$ref": "#/components/schemas/ContactPreferences"
        contactInfos:
          type: ["array","null"]
          items:
            "$ref": "#/components/schemas/ContactInfo"
    Profile:
      type: object
      description: User profile object
      properties:
        id:
          type: string
          description: MongoDB ObjectID as a hex string. Generated on creation; identifies the existing profile on update.
        alias:
          type: string
        consentConfirmedAt:
          type: integer
          format: int64
        createdAt:
          type: integer
          format: int64
          description: Unix timestamp in seconds; generated on creation.
        avatarID:
          type: string
        mainProfile:
          type: boolean
          description: Whether this is the main profile. Updates preserve the existing value.
      additionalProperties: true
    SurveyResponse:
      type: object
      properties:
        id:
          type: string
          description: MongoDB ObjectID as a hex string.
        key:
          type: string
        participantId:
          type: string
        versionId:
          type: string
        openedAt:
          type: integer
          format: int64
        submittedAt:
          type: integer
          format: int64
        arrivedAt:
          type: integer
          format: int64
        responses:
          type: [array, "null"]
          items:
            "$ref": "#/components/schemas/SurveyItemResponse"
        context:
          type: [object, "null"]
          additionalProperties:
            type: string
      additionalProperties: true
    SurveyItemResponse:
      type: object
      properties:
        key:
          type: string
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
        items:
          type: [array, "null"]
          items:
            "$ref": "#/components/schemas/SurveyItemResponse"
        response:
          anyOf:
          - "$ref": "#/components/schemas/ResponseItem"
          - type: "null"
        confidentialMode:
          type: string
        mapToKey:
          type: string
          description: Target key used for confidential responses.
      additionalProperties: true
    ResponseMeta:
      type: object
      properties:
        position:
          type: integer
          format: int32
        localeCode:
          type: string
        rendered:
          type: [array, "null"]
          items:
            type: integer
            format: int64
        displayed:
          type: [array, "null"]
          items:
            type: integer
            format: int64
        responded:
          type: [array, "null"]
          items:
            type: integer
            format: int64
      additionalProperties: true
    ResponseItem:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
        dtype:
          type: string
        items:
          type: [array, "null"]
          items:
            anyOf:
            - "$ref": "#/components/schemas/ResponseItem"
            - type: "null"
      additionalProperties: true
    UserAttributes:
      type: "object"
      properties:
        id:
          type: "string"
        userId:
          type: "string"
        type:
          type: "string"
        attributes:
          type: ["object","null"]
          additionalProperties: {}
        createdAt:
          type: "string"
          format: "date-time"
    StudyInfo:
      type: object
      properties:
        key:
          type: string
        status:
          type: string
        props:
          "$ref": "#/components/schemas/StudyProps"
        stats:
          "$ref": "#/components/schemas/StudyStats"
        profileIds:
          type: [array, "null"]
          items:
            type: string
          description: Profile IDs for participating studies; null in public study list and detail responses.
      required:
      - key
      - status
      - props
      - stats
      - profileIds
      additionalProperties: false
    StudyVariables:
      type: object
      properties:
        id:
          type: string
          description: MongoDB ObjectID
          example: 64e4b2f2c2a4e2b1a1c2d3e4
        createdAt:
          type: string
          format: date-time
        configUpdatedAt:
          type: string
          format: date-time
        valueUpdatedAt:
          type: string
          format: date-time
        studyKey:
          type: string
        key:
          type: string
        value:
          description: Value of the study variable, type depends on 'type'
          anyOf:
          - type: string
          - type: integer
          - type: number
            format: float
          - type: boolean
          - type: string
            format: date-time
        type:
          type: string
          enum:
          - string
          - int
          - float
          - boolean
          - date
        label:
          type: string
        description:
          type: string
        uiType:
          type: string
        uiPriority:
          type: integer
        configs:
          type: object
          additionalProperties: true
      required:
      - createdAt
      - configUpdatedAt
      - valueUpdatedAt
      - studyKey
      - key
      - value
      - type
    SurveyInfo:
      type: "object"
      properties:
        surveyKey:
          type: "string"
        studyKey:
          type: "string"
        name:
          type: ["array","null"]
          items:
            "$ref": "#/components/schemas/LocalisedObject"
        description:
          type: ["array","null"]
          items:
            "$ref": "#/components/schemas/LocalisedObject"
        typicalDuration:
          type: ["array","null"]
          items:
            "$ref": "#/components/schemas/LocalisedObject"
        versionID:
          type: "string"
    LocalisedObject:
      type: "object"
      properties:
        code:
          type: "string"
        parts:
          type: ["array","null"]
          items:
            "$ref": "#/components/schemas/ExpressionArg"
    ExpressionArg:
      type: "object"
      properties:
        dtype:
          type: "string"
        exp:
          anyOf:
          - {"$ref":"#/components/schemas/Expression"}
          - {"type":"null"}
        str:
          type: "string"
        num:
          type: "number"
    Expression:
      type: "object"
      properties:
        name:
          type: "string"
        returnType:
          type: "string"
        data:
          type: ["array","null"]
          items:
            "$ref": "#/components/schemas/ExpressionArg"
        metadata:
          type: [object, "null"]
          properties:
            slotTypes:
              type: [array, "null"]
              items:
                type: [string, "null"]
    Survey:
      type: "object"
      properties:
        id:
          type: "string"
        surveyKey:
          type: "string"
        props:
          "$ref": "#/components/schemas/SurveyProps"
        maxItemsPerPage:
          anyOf:
          - {"$ref":"#/components/schemas/MaxItemsPerPage"}
          - {"type":"null"}
        availableFor:
          type: "string"
        requireLoginBeforeSubmission:
          type: "boolean"
        published:
          type: "integer"
        unpublished:
          type: "integer"
        surveyDefinition:
          "$ref": "#/components/schemas/SurveyItem"
        versionId:
          type: "string"
        metadata:
          type: ["object","null"]
          additionalProperties:
            type: "string"
    SurveyProps:
      type: "object"
      properties:
        name:
          type: ["array","null"]
          items:
            "$ref": "#/components/schemas/LocalisedObject"
        description:
          type: ["array","null"]
          items:
            "$ref": "#/components/schemas/LocalisedObject"
        typicalDuration:
          type: ["array","null"]
          items:
            "$ref": "#/components/schemas/LocalisedObject"
    MaxItemsPerPage:
      type: "object"
      properties:
        large:
          type: "integer"
        small:
          type: "integer"
    SurveyItem:
      type: "object"
      properties:
        id:
          type: "string"
        key:
          type: "string"
        follows:
          type: ["array","null"]
          items:
            type: "string"
        condition:
          anyOf:
          - {"$ref":"#/components/schemas/Expression"}
          - {"type":"null"}
        priority:
          type: "number"
        metadata:
          type: ["object","null"]
          additionalProperties:
            type: "string"
        items:
          type: ["array","null"]
          items:
            "$ref": "#/components/schemas/SurveyItem"
        selectionMethod:
          anyOf:
          - {"$ref":"#/components/schemas/Expression"}
          - {"type":"null"}
        type:
          type: "string"
        components:
          anyOf:
          - {"$ref":"#/components/schemas/ItemComponent"}
          - {"type":"null"}
        validations:
          type: ["array","null"]
          items:
            "$ref": "#/components/schemas/Validation"
        confidentialMode:
          type: "string"
        mapToKey:
          type: "string"
    ItemComponent:
      type: "object"
      properties:
        role:
          type: "string"
        key:
          type: "string"
        content:
          type: ["array","null"]
          items:
            "$ref": "#/components/schemas/LocalisedObject"
        displayCondition:
          anyOf:
          - {"$ref":"#/components/schemas/Expression"}
          - {"type":"null"}
        disabled:
          anyOf:
          - {"$ref":"#/components/schemas/Expression"}
          - {"type":"null"}
        items:
          type: ["array","null"]
          items:
            "$ref": "#/components/schemas/ItemComponent"
        order:
          anyOf:
          - {"$ref":"#/components/schemas/Expression"}
          - {"type":"null"}
        dtype:
          type: "string"
        properties:
          anyOf:
          - {"$ref":"#/components/schemas/ComponentProperties"}
          - {"type":"null"}
        style:
          type: ["array","null"]
          items:
            "$ref": "#/components/schemas/Style"
        description:
          type: ["array","null"]
          items:
            "$ref": "#/components/schemas/LocalisedObject"
    ComponentProperties:
      type: "object"
      properties:
        min:
          anyOf:
          - {"$ref":"#/components/schemas/ExpressionArg"}
          - {"type":"null"}
        max:
          anyOf:
          - {"$ref":"#/components/schemas/ExpressionArg"}
          - {"type":"null"}
        stepSize:
          anyOf:
          - {"$ref":"#/components/schemas/ExpressionArg"}
          - {"type":"null"}
        dateInputMode:
          anyOf:
          - {"$ref":"#/components/schemas/ExpressionArg"}
          - {"type":"null"}
        pattern:
          type: "string"
    Style:
      type: "object"
      properties:
        key:
          type: "string"
        value:
          type: "string"
    Validation:
      type: "object"
      properties:
        key:
          type: "string"
        type:
          type: "string"
        rule:
          "$ref": "#/components/schemas/Expression"
    SurveyContext:
      type: "object"
      properties:
        mode:
          type: "string"
        previousResponses:
          type: ["array","null"]
          items:
            "$ref": "#/components/schemas/SurveyResponse"
        participantFlags:
          type: ["object","null"]
          additionalProperties:
            type: "string"
        studyVariables:
          type: ["object","null"]
          additionalProperties:
            "$ref": "#/components/schemas/StudyVariableValue"
    StudyVariableValue:
      type: "object"
      properties:
        type:
          type: "string"
        value: {}
    SubmissionEntry:
      type: "object"
      properties:
        profileID:
          type: "string"
        timestamp:
          type: "integer"
        surveyKey:
          type: "string"
        versionID:
          type: "string"
    ParticipantMessage:
      type: "object"
      properties:
        id:
          type: "string"
        type:
          type: "string"
        scheduledFor:
          type: "integer"
    Account:
