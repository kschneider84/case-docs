---
openapi: 3.1.0
info:
  title: Participant API
  version: 1.0.0
  description: >-
    Endpoints for participant authentication, user management, and study interactions.
    Depending on deployment configuration, routes may additionally require a recent
    email or SMS OTP verified through /v1/auth/otp/verify. Missing or expired OTP
    verification returns 401 with an error message (missing OTP or invalid OTP).
paths:
  "/":
    get:
      summary: Health check
      operationId: getHealth
      tags:
      - misc
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HealthStatus"
              examples:
                ok:
                  value:
                    status: ok
  "/v1/auth/login":
    post:
      tags:
      - auth
      summary: Login with email and password
      operationId: loginWithEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                instanceId:
                  type: string
              required:
              - email
              - password
              - instanceId
              additionalProperties: true
      responses:
        '200':
          description: Access and refresh tokens with user
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    "$ref": "#/components/schemas/TokenEnvelope"
                  user:
                    "$ref": "#/components/schemas/User"
                required:
                - token
                - user
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '500':
          "$ref": "#/components/responses/Error500"
  "/v1/auth/signup":
    post:
      tags:
      - auth
      summary: Sign up with email
      operationId: signupWithEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                instanceId:
                  type: string
                infoCheck:
                  type: string
                preferredLanguage:
                  type: string
                withAttributes:
                  type: [object, "null"]
                  properties:
                    type:
                      type: string
                    attributes:
                      type: object
                      additionalProperties: true
              required:
              - email
              - password
              - instanceId
              additionalProperties: true
      responses:
        '200':
          description: Access and refresh tokens with user
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    "$ref": "#/components/schemas/TokenEnvelope"
                  user:
                    "$ref": "#/components/schemas/User"
                required:
                - token
                - user
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '429':
          "$ref": "#/components/responses/Error429"
        '500':
          "$ref": "#/components/responses/Error500"
  "/v1/auth/login-with-temptoken":
    post:
      tags:
      - auth
      summary: Login using a temporary token (optionally with password or access token)
      operationId: loginWithTempToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tempToken:
                  type: string
                accessToken:
                  type: string
                password:
                  type: string
              required:
              - tempToken
              additionalProperties: true
              description: Provide either accessToken or password along with tempToken.
      responses:
        '200':
          description: Access and refresh tokens with user
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    "$ref": "#/components/schemas/TokenEnvelopeWithLastOTP"
                  user:
                    "$ref": "#/components/schemas/User"
                required:
                - token
                - user
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '500':
          "$ref": "#/components/responses/Error500"
  "/v1/auth/temptoken-info":
    post:
      tags:
      - auth
      summary: Get info for a temporary token
      operationId: getTempTokenInfo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                instanceId:
                  type: string
                tempToken:
                  type: string
              required:
              - instanceId
              - tempToken
              additionalProperties: true
      responses:
        '200':
          description: Info returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  userID:
                    type: string
                  email:
                    type: string
                    format: email
                required:
                - userID
                - email
                additionalProperties: false
        '400':
          "$ref": "#/components/responses/Error400"
        '500':
          "$ref": "#/components/responses/Error500"
  "/v1/auth/token/renew":
    post:
      tags:
      - auth
      summary: Renew access token
      security:
      - BearerAuth: []
      operationId: renewToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
              required:
              - refreshToken
              additionalProperties: true
      responses:
        '200':
          description: Access and refresh tokens with user
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    "$ref": "#/components/schemas/TokenEnvelopeWithLastOTP"
                  user:
                    "$ref": "#/components/schemas/User"
                required:
                - token
                - user
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '500':
          "$ref": "#/components/responses/Error500"
  "/v1/auth/token/validate":
    get:
      tags:
      - auth
      summary: Validate access token
      security:
      - BearerAuth: []
      operationId: validateToken
      description: >-
        The backend requires a nonempty request payload even for this GET operation.
        A body such as {} is sufficient; its contents are not interpreted.
        A request with Content-Length 0 returns 400 with error payload missing.
      requestBody:
        required: true
        content:
          application/json:
            schema: {}
            example: {}
      responses:
        '200':
          description: Token valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokenInfos:
                    "$ref": "#/components/schemas/ParticipantUserClaims"
                required:
                - tokenInfos
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
  "/v1/auth/token/revoke":
    get:
      tags:
      - auth
      summary: Revoke refresh tokens for user
      security:
      - BearerAuth: []
      operationId: revokeTokens
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Message"
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '500':
          "$ref": "#/components/responses/Error500"
  "/v1/auth/resend-email-verification":
    post:
      tags:
      - auth
      summary: Resend email verification
      security:
      - BearerAuth: []
      operationId: resendEmailVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required:
              - email
      responses:
        '200':
          "$ref": "#/components/responses/MessageOk"
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '429':
          "$ref": "#/components/responses/Error429"
        '500':
          "$ref": "#/components/responses/Error500"
  "/v1/auth/verify-email":
    post:
      tags:
      - auth
      summary: Verify email by token
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
              required:
              - token
      responses:
        '200':
          description: User returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    "$ref": "#/components/schemas/User"
                required:
                - user
        '400':
          "$ref": "#/components/responses/Error400"
        '500':
          "$ref": "#/components/responses/Error500"
  "/v1/auth/logout":
    post:
      tags:
      - auth
      summary: Logout user (invalidate current session)
      security:
      - BearerAuth: []
      operationId: logout
      responses:
        '200':
          description: User logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  tokensRevoked:
                    type: integer
                required:
                - message
                - tokensRevoked
                additionalProperties: false
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '500':
          "$ref": "#/components/responses/Error500"
  "/v1/auth/otp":
    get:
      tags:
      - auth
      summary: Request OTP (email by default)
      security:
      - BearerAuth: []
      operationId: requestOTP
      parameters:
      - name: type
        in: query
        schema:
          type: string
          enum:
          - email
          - sms
          default: email
      responses:
        '200':
          "$ref": "#/components/responses/MessageOk"
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '500':
          "$ref": "#/components/responses/Error500"
  "/v1/auth/otp/verify":
    post:
      tags:
      - auth
      summary: Verify OTP code
      security:
      - BearerAuth: []
      operationId: verifyOTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
              required:
              - code
              additionalProperties: true
      responses:
        '200':
          description: Access and refresh tokens with user
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    "$ref": "#/components/schemas/TokenEnvelopeWithLastOTP"
                  user:
                    "$ref": "#/components/schemas/User"
                required:
                - token
                - user
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '500':
          "$ref": "#/components/responses/Error500"
  "/v1/password-reset/initiate":
    post:
      tags:
      - password
      summary: Initiate password reset
      operationId: initiatePasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                instanceID:
                  type: string
              required:
              - email
              - instanceID
              additionalProperties: true
      responses:
        '200':
          "$ref": "#/components/responses/MessageOk"
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '429':
          "$ref": "#/components/responses/Error429"
        '500':
          "$ref": "#/components/responses/Error500"
  "/v1/password-reset/get-infos":
    post:
      tags:
      - password
      summary: Get info for a password reset token
      operationId: getPasswordResetInfos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
              required:
              - token
      responses:
        '200':
          description: Account ID returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  accountId:
                    type: string
                required:
                - accountId
        '400':
          "$ref": "#/components/responses/Error400"
        '500':
          "$ref": "#/components/responses/Error500"
  "/v1/password-reset/reset":
    post:
      tags:
      - password
      summary: Reset password
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                newPassword:
                  type: string
              required:
              - token
              - newPassword
              additionalProperties: true
      responses:
        '200':
          "$ref": "#/components/responses/MessageOk"
        '400':
          "$ref": "#/components/responses/Error400"
        '500':
          "$ref": "#/components/responses/Error500"
  "/v1/study-service/studies/":
    get:
      tags:
      - studies
      summary: List studies by status
      operationId: getStudiesByStatus
      parameters:
      - name: instanceID
        in: query
        required: true
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  studies:
                    type: array
                    items:
                      "$ref": "#/components/schemas/StudyInfo"
                required:
                - studies
        '401':
          "$ref": "#/components/responses/Error401"
        '500':
          "$ref": "#/components/responses/Error500"
  "/v1/study-service/studies/{studyKey}":
    get:
      tags:
      - studies
      summary: Get study by key
      operationId: getStudy
      parameters:
      - name: studyKey
        in: path
        required: true
        schema:
          type: string
      - name: instanceID
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  study:
                    "$ref": "#/components/schemas/StudyInfo"
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '500':
          "$ref": "#/components/responses/Error500"
  "/v1/study-service/studies/{studyKey}/code-lists/has-code":
    get:
      tags:
      - studies
      summary: Check if a code exists in a code list
      operationId: studyHasCodeListCode
      parameters:
      - name: studyKey
        in: path
        required: true
        schema:
          type: string
      - name: instanceID
        in: query
        required: true
        schema:
          type: string
      - name: listKey
        in: query
        required: true
        schema:
          type: string
      - name: code
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  exists:
                    type: boolean
                required:
                - exists
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '500':
          "$ref": "#/components/responses/Error500"
  "/v1/study-service/studies/{studyKey}/code-lists/available-count":
    get:
      tags:
      - studies
      summary: Count available codes in a code list
      operationId: getStudyCodeListAvailableCount
      parameters:
      - name: studyKey
        in: path
        required: true
        schema:
          type: string
      - name: listKey
        in: query
        required: true
        schema:
          type: string
      - name: instanceID
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  availableCount:
                    type: integer
                required:
                - availableCount
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '500':
          "$ref": "#/components/responses/Error500"
  "/v1/study-service/studies/{studyKey}/variables":
    get:
      tags:
      - studies
      summary: List variables for a study
      operationId: getStudyVariables
      parameters:
      - name: studyKey
        in: path
        required: true
        schema:
          type: string
      - name: instanceID
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  variables:
                    type: array
                    items:
                      "$ref": "#/components/schemas/StudyVariables"
                required:
                - variables
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '500':
          "$ref": "#/components/responses/Error500"
  "/v1/study-service/studies/{studyKey}/variables/{variableKey}":
    get:
      tags:
      - studies
      summary: Get a study variable
      operationId: getStudyVariable
      parameters:
      - name: studyKey
        in: path
        required: true
        schema:
          type: string
      - name: variableKey
        in: path
        required: true
        schema:
          type: string
      - name: instanceID
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  variable:
                    "$ref": "#/components/schemas/StudyVariables"
                required:
                - variable
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '500':
          "$ref": "#/components/responses/Error500"
  "/v1/study-service/studies/participating":
    get:
      tags:
      - studies
      summary: List studies the user participates in
      security:
      - BearerAuth: []
      operationId: getParticipatingStudies
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  studies:
                    type: array
                    items:
                      "$ref": "#/components/schemas/StudyInfo"
                required:
                - studies
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '500':
          "$ref": "#/components/responses/Error500"
  "/v1/study-service/events/{studyKey}/enter":
    post:
      tags:
      - events
      summary: Enter a study
      security:
      - BearerAuth: []
      operationId: enterStudy
      parameters:
      - name: studyKey
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                profileID:
                  type: string
              required:
              - profileID
      responses:
        '200':
          description: Assigned surveys returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  assignedSurveys:
                    type: array
                    items:
                      "$ref": "#/components/schemas/AssignedSurvey"
                required:
                - assignedSurveys
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '500':
          "$ref": "#/components/responses/Error500"
  "/v1/study-service/events/{studyKey}/custom":
    post:
      tags:
      - events
      summary: Trigger a custom study event
      security:
      - BearerAuth: []
      operationId: customStudyEvent
      parameters:
      - name: studyKey
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                eventKey:
                  type: string
                profileID:
                  type: string
                payload:
                  type: object
                  additionalProperties: true
              required:
              - eventKey
              - profileID
      responses:
        '200':
          description: Assigned surveys returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  assignedSurveys:
                    type: array
                    items:
                      "$ref": "#/components/schemas/AssignedSurvey"
                required:
                - assignedSurveys
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '500':
          "$ref": "#/components/responses/Error500"
  "/v1/study-service/events/{studyKey}/submit":
    post:
      tags:
      - events
      summary: Submit survey response
      security:
      - BearerAuth: []
      operationId: submitSurveyEvent
      parameters:
      - name: studyKey
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                profileID:
                  type: string
                response:
                  "$ref": "#/components/schemas/SurveyResponse"
              required:
              - profileID
              - response
      responses:
        '200':
          description: Assigned surveys returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  assignedSurveys:
                    type: array
                    items:
                      "$ref": "#/components/schemas/AssignedSurvey"
                required:
                - assignedSurveys
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '500':
          "$ref": "#/components/responses/Error500"
  "/v1/study-service/events/{studyKey}/leave":
    post:
      tags:
      - events
      summary: Leave a study
      security:
      - BearerAuth: []
      operationId: leaveStudyEvent
      parameters:
      - name: studyKey
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                profileID:
                  type: string
              required:
              - profileID
      responses:
        '200':
          description: Assigned surveys returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  assignedSurveys:
                    type: array
                    items:
                      "$ref": "#/components/schemas/AssignedSurvey"
                required:
                - assignedSurveys
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '500':
          "$ref": "#/components/responses/Error500"
  "/v1/study-service/events/{studyKey}/merge-temporary-participant":
    post:
      tags:
      - events
      summary: Merge temporary participant into user profile
      security:
      - BearerAuth: []
      operationId: mergeTempParticipant
      parameters:
      - name: studyKey
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                profileID:
                  type: string
                temporaryParticipantID:
                  type: string
              required:
              - profileID
              - temporaryParticipantID
      responses:
        '200':
          description: Assigned surveys of participant returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  assignedSurveys:
                    type: array
                    items:
                      "$ref": "#/components/schemas/AssignedSurvey"
                required:
                - assignedSurveys
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '500':
          "$ref": "#/components/responses/Error500"
  "/v1/study-service/events/{studyKey}/merge-virtual-participant":
    post:
      tags:
      - events
      summary: Merge a virtual participant into user profile by linking code
      security:
      - BearerAuth: []
      operationId: mergeVirtualParticipant
      parameters:
      - name: studyKey
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
