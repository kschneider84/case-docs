      operationId: getStudyResponsesForProfile
      parameters:
      - name: studyKey
        in: path
        required: true
        schema:
          type: string
      - name: pid
        in: query
        required: true
        description: ID of a profile belonging to the authenticated user.
        schema:
          type: string
      - name: surveyKey
        in: query
        required: false
        description: Survey key to filter responses. If omitted, the backend filters on an empty survey key; it does not return responses across all surveys.
        schema:
          type: string
      - name: page
        in: query
        description: page number (starting from 1)
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        description: maximum number of responses per page
        schema:
          type: integer
          minimum: 1
          default: 10
      - name: filter
        in: query
        description: JSON-encoded object to filter responses; URL-encode the query value.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      - name: sort
        in: query
        description: JSON-encoded object to sort responses; URL-encode the query value.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      - name: shortKeys
        in: query
        description: whether to return short keys for responses
        schema:
          type: boolean
          default: false
      - name: questionOptionSep
        in: query
        description: character used to seperate slot keys in response
        schema:
          type: string
          default: "-"
      - name: format
        in: query
        description: Parsed but ignored by this endpoint; responses are always flattened JSON objects.
        schema:
          type: string
          default: wide
      - name: extraContextColumns
        in: query
        description: comma-separated list of extra context columns to include in the
          response
        schema:
          type: string
      responses:
        '200':
          description: Responses returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  responses:
                    type: array
                    items:
                      anyOf:
                      - "$ref": "#/components/schemas/FlattenedSurveyResponse"
                      - type: "null"
                  pagination:
                    "$ref": "#/components/schemas/PaginationInfos"
                required:
                - responses
                - pagination
        '400':
          "$ref": "#/components/responses/Error400"
        '401':
          "$ref": "#/components/responses/Error401"
        '500':
          "$ref": "#/components/responses/Error500"
